<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- 배경 지도 (3단 접힌 지도 형태) -->
  <g stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 왼쪽 면 -->
    <path d="M 8 16 L 24 10 L 24 50 L 8 56 Z" fill="#E8EEF5" />
    <!-- 가운데 면 -->
    <path d="M 24 10 L 40 16 L 40 56 L 24 50 Z" fill="#D5E1ED" />
    <!-- 오른쪽 면 -->
    <path d="M 40 16 L 56 10 L 56 50 L 40 56 Z" fill="#E8EEF5" />
  </g>

  <!-- 핀 마커 그림자 -->
  <ellipse cx="32" cy="46" rx="6" ry="2.5" fill="#1A252F" opacity="0.3" />

  <!-- 핀 마커 -->
  <g>
    <!-- 마커 외형 -->
    <path d="M 32 18
             C 24 18 18 24 18 32
             C 18 41 32 47 32 47
             C 32 47 46 41 46 32
             C 46 24 40 18 32 18 Z" fill="#FF4B4B" stroke="#C0392B" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- 마커 내부 원 -->
    <circle cx="32" cy="30" r="5" fill="#FFFFFF" />
  </g>
</svg>